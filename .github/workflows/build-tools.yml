name: build tools

on:
  push:
    branches: [main]
    paths: ["uatdiff/**", "insertgen/**", ".github/workflows/build-tools.yml"]
  pull_request:
    paths: ["uatdiff/**", "insertgen/**", ".github/workflows/build-tools.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [uatdiff, insertgen]
    defaults:
      run:
        working-directory: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.tool }}/go.mod
          cache-dependency-path: ${{ matrix.tool }}/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Build Windows exe
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ${{ matrix.tool }}.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-exe
          path: ${{ matrix.tool }}/${{ matrix.tool }}.exe

  # On main, replace the exes on the "latest" release so update_tools.bat
  # always downloads the newest builds from the same links.
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Bản build tự động từ commit ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d\ %H:%M) UTC). Chạy update_tools.bat để tải bản mới nhất."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Tools (bản mới nhất)" --notes "$notes"
          else
            gh release create latest --title "Tools (bản mới nhất)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload latest dist/*.exe --clobber
